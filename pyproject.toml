[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"
[project]
name = "selected-person-tracking"
version = "0.2.0"
description = "Selected pedestrian tracking and identity recovery after occlusion"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["numpy>=1.24,<3", "PyYAML>=6,<7"]
[project.optional-dependencies]
runtime = ["ultralytics==8.4.158", "opencv-python>=4.8,<5", "Pillow>=10,<13", "onnxruntime>=1.18,<2", "onnx>=1.16,<2", "lap==0.5.13"]
deploy = ["ultralytics==8.4.158", "opencv-python>=4.8,<5", "Pillow>=10,<13", "onnxruntime-gpu==1.30.0", "onnx==1.23.0", "lap==0.5.13"]
evaluation = ["trackeval==1.3.0"]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]
[project.scripts]
spt-smoke = "a1_tracker.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["tools/vendor"]
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
[tool.ruff.lint.per-file-ignores]
"tools/run_*.py" = ["E402"]
"tools/crowdhuman_training.py" = ["E402"]
"tests/test_crowdhuman_training.py" = ["E402"]
"tests/test_research_variants.py" = ["E402"]
